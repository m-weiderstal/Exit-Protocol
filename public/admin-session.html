<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exit Protocol — Sparad lektion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
      color: #00ff41;
      overflow: hidden;
    }

    #rain {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.12;
      pointer-events: none;
    }

    header, main { position: relative; z-index: 1; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: rgba(0, 0, 0, 0.92);
      border-bottom: 1px solid rgba(0, 255, 65, 0.3);
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    h1 {
      font-size: 0.95rem;
      color: #00ff41;
      text-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
      letter-spacing: 0.04em;
    }

    .badge {
      background: rgba(0, 255, 65, 0.08);
      border: 1px solid rgba(0, 255, 65, 0.35);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.75rem;
      color: #00cc33;
    }

    .btn {
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 65, 0.35);
      background: transparent;
      color: rgba(0, 255, 65, 0.65);
      font-size: 0.78rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: #00ff41;
      color: #00ff41;
      box-shadow: 0 0 8px rgba(0, 255, 65, 0.25);
    }

    main { flex: 1; display: flex; overflow: hidden; }

    /* ── Left panel ── */
    .panel {
      width: 280px;
      flex-shrink: 0;
      border-right: 1px solid rgba(0, 255, 65, 0.2);
      background: rgba(0, 5, 0, 0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-top {
      padding: 18px 20px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(0, 255, 65, 0.12);
    }

    .section-label {
      font-size: 0.68rem;
      color: rgba(0, 255, 65, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .export-buttons { display: flex; flex-direction: column; gap: 6px; }

    .btn-export {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid rgba(0, 255, 65, 0.2);
      background: rgba(0, 255, 65, 0.04);
      color: rgba(0, 255, 65, 0.65);
      font-size: 0.8rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      display: block;
    }

    .btn-export:hover {
      border-color: rgba(0, 255, 65, 0.6);
      color: #00ff41;
      background: rgba(0, 255, 65, 0.08);
    }

    /* ── Submissions ── */
    .submissions {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .submissions::-webkit-scrollbar { width: 3px; }
    .submissions::-webkit-scrollbar-thumb { background: rgba(0, 255, 65, 0.3); }

    .submission-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(0, 255, 65, 0.08);
    }

    .submission-item:last-child { border-bottom: none; }

    .sub-nr { font-size: 0.68rem; color: rgba(0, 255, 65, 0.35); margin-bottom: 3px; }
    .sub-text { font-size: 0.82rem; color: rgba(0, 255, 65, 0.85); line-height: 1.5; }

    /* ── Word cloud area ── */
    .cloud-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    canvas { max-width: 100%; max-height: 100%; }

    .loading { color: rgba(0, 255, 65, 0.3); font-size: 0.85rem; }
  </style>
</head>
<body>

<canvas id="rain"></canvas>

<header>
  <div class="header-left">
    <h1 id="header-title">// Laddar lektion...</h1>
    <span class="badge" id="count-badge"></span>
  </div>
  <a class="btn" href="/admin/dashboard">← Tillbaka</a>
</header>

<main>
  <aside class="panel">
    <div class="panel-top">
      <p class="section-label">// Exportera denna lektion</p>
      <div class="export-buttons" id="export-buttons"></div>
    </div>
    <div class="submissions">
      <p class="section-label">// Alla svar</p>
      <div id="submissions-list"></div>
    </div>
  </aside>

  <div class="cloud-area">
    <p class="loading" id="loading">> Laddar ordmoln...</p>
    <canvas id="cloud-canvas"></canvas>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
<script>
  (function () {
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');
    const CHARS = 'アカサタナハマヤラワイキシチニヒミリウクスツヌフムユルンエケセテネヘメオコソトノホモヨロ01001101';
    const SIZE = 13;
    let drops = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drops = Array.from({ length: Math.floor(canvas.width / SIZE) }, () => Math.random() * -80);
    }

    function draw() {
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = SIZE + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillStyle = i % 5 === 0 ? '#ffffff' : '#00ff41';
        ctx.fillText(CHARS[Math.floor(Math.random() * CHARS.length)], i * SIZE, drops[i] * SIZE);
        if (drops[i] * SIZE > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }

    resize();
    window.addEventListener('resize', resize);
    setInterval(draw, 40);
  })();

  const COLORS = [
    '#00ff41', '#00e639', '#39ff73', '#00cc33',
    '#66ff99', '#00b32d', '#80ffb3', '#33ff66',
    '#00ff80', '#4dff88',
  ];

  const id = new URLSearchParams(location.search).get('id');

  if (!id) {
    document.getElementById('header-title').textContent = '// Lektion hittades inte.';
    document.getElementById('loading').textContent = '';
  } else {
    load(id);
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleString('sv-SE', {
      year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  }

  async function load(id) {
    const res = await fetch(`/admin/sessions/${id}`);
    if (!res.ok) {
      document.getElementById('header-title').textContent = '// Lektion hittades inte.';
      document.getElementById('loading').textContent = '';
      return;
    }
    const snap = await res.json();

    document.getElementById('header-title').textContent = `// ${formatDate(snap.sparadDatum)}`;
    document.getElementById('count-badge').textContent = `${snap.antalSvar} svar`;
    document.title = `Exit Protocol — ${formatDate(snap.sparadDatum)}`;

    document.getElementById('export-buttons').innerHTML = `
      <a class="btn-export" href="/admin/sessions/${id}/export/csv" download>» CSV</a>
      <a class="btn-export" href="/admin/sessions/${id}/export/txt" download>» TXT</a>
      <a class="btn-export" href="/admin/sessions/${id}/export/excel" download>» Excel</a>
      <button class="btn-export" onclick="downloadCloud('${formatDate(snap.sparadDatum)}')">» Ladda ner som bild</button>
    `;

    document.getElementById('submissions-list').innerHTML = snap.submissions.map(s => `
      <div class="submission-item">
        <div class="sub-nr">ELEV_${String(s.nr).padStart(3, '0')}</div>
        <div class="sub-text">> ${escapeHtml(s.svar)}</div>
      </div>
    `).join('');

    drawCloud(snap.wordCounts);
  }

  function drawCloud(wordCounts) {
    const entries = Object.entries(wordCounts);
    const canvas = document.getElementById('cloud-canvas');
    document.getElementById('loading').style.display = 'none';
    if (entries.length === 0) return;

    const area = document.querySelector('.cloud-area');
    const w = area.clientWidth - 32;
    const h = area.clientHeight - 32;
    canvas.width = w;
    canvas.height = h;

    const maxCount = Math.max(...entries.map(([, v]) => v));
    const list = entries
      .sort(([, a], [, b]) => b - a)
      .map(([word, count], i) => [
        word,
        Math.round(12 + (count / maxCount) * (Math.min(w, h) * 0.05)),
        COLORS[i % COLORS.length],
      ]);

    WordCloud(canvas, {
      list,
      gridSize: Math.round(8 * w / 1024),
      weightFactor: 1,
      fontFamily: "'Courier New', Courier, monospace",
      color: (word) => {
        const idx = list.findIndex(([w]) => w === word);
        return COLORS[idx % COLORS.length];
      },
      rotateRatio: 0.3,
      rotationSteps: 2,
      backgroundColor: 'transparent',
      shrinkToFit: true,
    });
  }

  function downloadCloud(label) {
    const src = document.getElementById('cloud-canvas');
    if (!src.width) return;
    const tmp = document.createElement('canvas');
    tmp.width = src.width;
    tmp.height = src.height;
    const ctx = tmp.getContext('2d');
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, tmp.width, tmp.height);
    ctx.drawImage(src, 0, 0);
    const a = document.createElement('a');
    a.download = `ordmoln-${(label || 'lektion').replace(/[^a-z0-9]/gi, '_')}.png`;
    a.href = tmp.toDataURL('image/png');
    a.click();
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
